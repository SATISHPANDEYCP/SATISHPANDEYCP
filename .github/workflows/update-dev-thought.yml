name: Update Dev Thought

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-thought:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update thought in README
        run: |
          python - <<'PY'
          import json
          import re
          import time
          import urllib.request

          README_PATH = "README.md"
          START = "<!--DEV_THOUGHT_START-->"
          END = "<!--DEV_THOUGHT_END-->"

          fallback_quotes = [
              ("Programs must be written for people to read, and only incidentally for machines to execute.", "Harold Abelson"),
              ("Any fool can write code that a computer can understand. Good programmers write code that humans can understand.", "Martin Fowler"),
              ("Simplicity is the soul of efficiency.", "Austin Freeman"),
              ("First, solve the problem. Then, write the code.", "John Johnson"),
              ("Before software can be reusable it first has to be usable.", "Ralph Johnson"),
              ("Talk is cheap. Show me the code.", "Linus Torvalds"),
              ("The most disastrous thing that you can ever learn is your first programming language.", "Alan Kay"),
              ("Code is like humor. When you have to explain it, it's bad.", "Cory House"),
              ("Deleted code is debugged code.", "Jeff Sickel"),
              ("Controlling complexity is the essence of computer programming.", "Brian Kernighan"),
              ("The best error message is the one that never shows up.", "Thomas Fuchs"),
              ("Measuring programming progress by lines of code is like measuring aircraft building progress by weight.", "Bill Gates"),
              ("Make it work, make it right, make it fast.", "Kent Beck"),
              ("There are two ways to write error-free programs; only the third one works.", "Alan Perlis"),
              ("One of my most productive days was throwing away 1000 lines of code.", "Ken Thompson"),
              ("It is far easier to make a correct program fast than to make a fast program correct.", "Herb Sutter"),
              ("Simple things should be simple, complex things should be possible.", "Alan Kay"),
              ("The computing scientist's main challenge is not to get confused by the complexities of his own making.", "Edsger W. Dijkstra"),
              ("The function of good software is to make the complex appear simple.", "Grady Booch"),
              ("The most important property of a program is whether it accomplishes the intention of its user.", "C. A. R. Hoare"),
              ("Premature optimization is the root of all evil.", "Donald Knuth"),
              ("When in doubt, use brute force.", "Ken Thompson"),
              ("Software is a great combination between artistry and engineering.", "Bill Gates"),
              ("Truth can only be found in one place: the code.", "Robert C. Martin"),
              ("A language that doesn't affect the way you think about programming is not worth knowing.", "Alan Perlis"),
              ("If debugging is the process of removing software bugs, then programming must be the process of putting them in.", "Edsger W. Dijkstra"),
              ("Good code is its own best documentation.", "Steve McConnell"),
              ("The only way to learn a new programming language is by writing programs in it.", "Dennis Ritchie"),
              ("Testing can prove the presence of bugs, but not their absence.", "Edsger W. Dijkstra"),
              ("Readability counts.", "Tim Peters"),
              ("Code never lies, comments sometimes do.", "Ron Jeffries"),
              ("Fix the cause, not the symptom.", "Steve Maguire"),
              ("The sooner you start to code, the longer the program will take.", "Roy Carlson"),
              ("Programs are meant to be read by humans and only incidentally for computers to execute.", "Hal Abelson"),
          ]

          dev_keywords = {
              "code", "coding", "program", "software", "developer", "develop", "debug",
              "bug", "system", "algorithm", "engineering", "engineer", "computer", "function",
              "clean code", "refactor", "architecture", "api", "backend", "frontend"
          }

          dev_authors = {
              "Martin Fowler", "Linus Torvalds", "Alan Kay", "Edsger W. Dijkstra", "Donald Knuth",
              "Bjarne Stroustrup", "Grace Hopper", "Ken Thompson", "Brian Kernighan", "John Johnson",
              "Harold Abelson", "Ralph Johnson", "Cory House", "Robert C. Martin"
          }

          def looks_developer_related(text, author_name):
              lowered = (text or "").lower()
              if any(word in lowered for word in dev_keywords):
                  return True
              return (author_name or "").strip() in dev_authors

          quote = None
          author = None

          try:
              with urllib.request.urlopen("https://zenquotes.io/api/random", timeout=10) as response:
                  payload = json.loads(response.read().decode("utf-8"))
                  if isinstance(payload, list) and payload:
                      candidate_quote = payload[0].get("q", "").strip()
                      candidate_author = payload[0].get("a", "").strip()
                      if looks_developer_related(candidate_quote, candidate_author):
                          quote = candidate_quote
                          author = candidate_author
          except Exception:
              pass

          with open(README_PATH, "r", encoding="utf-8") as readme_file:
              readme = readme_file.read()

          # Read current thought so we can avoid repeating it.
          current_match = re.search(r'<i>"(.*?)"</i>', readme, re.DOTALL)
          current_quote = current_match.group(1).strip() if current_match else ""

          # If API is unavailable, non-dev, or returns same quote, rotate by 5-min slot.
          if not quote or not author or quote == current_quote:
              slot = int(time.time() // 300)
              start = slot % len(fallback_quotes)
              for i in range(len(fallback_quotes)):
                  candidate_quote, candidate_author = fallback_quotes[(start + i) % len(fallback_quotes)]
                  if candidate_quote != current_quote:
                      quote, author = candidate_quote, candidate_author
                      break

          quote = quote.replace('"', "'")
          author = author.replace('"', "'")

          replacement = (
              f"{START}\n"
              f"<p align=\"center\"><strong><i>\"{quote}\"</i></strong></p>\n\n"
              f"<p align=\"center\"><sub>- {author}</sub></p>\n"
              f"{END}"
          )

          pattern = re.compile(re.escape(START) + r".*?" + re.escape(END), re.DOTALL)
          if not pattern.search(readme):
              raise RuntimeError("Thought markers not found in README.md")

          updated = pattern.sub(replacement, readme, count=1)

          with open(README_PATH, "w", encoding="utf-8", newline="\n") as readme_file:
              readme_file.write(updated)
          PY

      - name: Commit changes if needed
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update dev thought"
          git push
